<script>
(() => {
 const secciones=['pedidos','cotizacion','ganancia'];
 const porId=id=>document.getElementById(id);
 const usd=v=>'USD '+Number(v).toLocaleString('es-AR',{minimumFractionDigits:2,maximumFractionDigits:2});
 const elemento=(tag,texto,clase)=>{const e=document.createElement(tag);e.textContent=texto;if(clase)e.className=clase;return e;};
 async function api(url,opciones={}){const r=await fetch(url,{cache:'no-store',...opciones});const datos=await r.json().catch(()=>({}));if(!r.ok)throw new Error(datos.detail||datos.error||'No se pudo completar la operación.');return datos;}
 let consultando=0, cargadoCambio=false, claveManual=crypto.randomUUID(), editando=null, completando=null;
 async function cargarCotizacion(){try{const d=await api('/api/cotizacion');porId('cotizacion-actual').textContent=d.valor;porId('cotizacion-valor').value=d.valor;cargadoCambio=true;}catch(e){porId('cotizacion-resultado').textContent=e.message;}}
 function abrirSeccionAdmin(){const nombre=secciones.includes(location.hash.slice(1))?location.hash.slice(1):'pedidos';secciones.forEach(s=>porId('admin-seccion-'+s).hidden=s!==nombre);document.querySelectorAll('.admin-secciones a').forEach(a=>{if(a.hash==='#'+nombre)a.setAttribute('aria-current','page');else a.removeAttribute('aria-current');});if(nombre==='cotizacion'&&!cargadoCambio)cargarCotizacion();if(nombre==='ganancia')cargarGanancia();}
 window.addEventListener('hashchange',abrirSeccionAdmin);
 porId('cotizacion-form').addEventListener('submit',async e=>{e.preventDefault();const btn=porId('cotizacion-guardar');btn.disabled=true;porId('cotizacion-resultado').textContent='Guardando…';try{const d=await api('/admin/cotizacion',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({valor:porId('cotizacion-valor').value})});porId('cotizacion-actual').textContent=d.valor;porId('cotizacion-resultado').textContent='Cotización guardada.';}catch(e){porId('cotizacion-resultado').textContent=e.message;}finally{btn.disabled=false;}});
 const partes=new Intl.DateTimeFormat('en-CA',{timeZone:'America/Argentina/Cordoba',year:'numeric',month:'2-digit',day:'2-digit'}).formatToParts(new Date());
 const parte=t=>partes.find(p=>p.type===t).value;const hoy=parte('year')+'-'+parte('month')+'-'+parte('day');
 porId('ganancia-desde').value=hoy.slice(0,8)+'01';porId('ganancia-hasta').value=hoy;porId('ganancia-fecha').value=hoy;
 function resetManual(){editando=null;claveManual=crypto.randomUUID();porId('ganancia-manual').reset();porId('ganancia-fecha').value=hoy;porId('ganancia-tipo').disabled=false;porId('ganancia-cancelar').hidden=true;porId('ganancia-guardar').textContent='Guardar movimiento';}
 porId('ganancia-cancelar').addEventListener('click',resetManual);
 async function cargarGanancia(){const secuencia=++consultando;porId('ganancia-estado').textContent='Consultando…';porId('ganancia-totales').replaceChildren();porId('ganancia-listado').replaceChildren();try{const q=new URLSearchParams({desde:porId('ganancia-desde').value,hasta:porId('ganancia-hasta').value});const d=await api('/admin/ganancia?'+q);if(secuencia!==consultando)return;porId('ganancia-estado').textContent=d.pendientes?`${d.pendientes} movimientos pendientes de completar; no se incluyen en la ganancia.`:'Todos los movimientos del período tienen importes calculados.';
 for(const estado of ['confirmado','estimado']){const r=d[estado],div=elemento('div','','ganancia-resumen');div.append(elemento('h3',estado==='confirmado'?'Ganancia confirmada':'Ganancia estimada · por verificar'),elemento('strong',usd(r.neto_usd)));const dl=elemento('dl','','ganancia-desglose');for(const [k,label] of [['ingreso_usd','Ingresos'],['costo_usd','Productos'],['comision_usd','Comisiones'],['gasto_usd','Gastos']]){const x=elemento('div','');x.append(elemento('dt',label),elemento('dd',usd(r[k])));dl.append(x);}div.append(dl);porId('ganancia-totales').append(div);}
 if(!d.movimientos.length)porId('ganancia-listado').append(elemento('p','Sin movimientos en estas fechas.'));
 for(const m of d.movimientos){const fila=elemento('article','','ganancia-fila');fila.append(elemento('h3',m.concepto),elemento('p',`${m.fecha_operacion.split("-").reverse().join("/")} · ${m.estado_evidencia} · ${m.neto_usd===null?'Pendiente':usd(m.neto_usd)}`));if(m.motivos.length)fila.append(elemento('p',m.motivos.join(' · ')));if(m.fuente_tipo==='manual'){const editar=elemento('button','Editar');editar.type='button';editar.onclick=()=>{editando=m;porId('ganancia-carga').open=true;porId('ganancia-tipo').value=m.tipo;porId('ganancia-tipo').disabled=true;porId('ganancia-fecha').value=m.fecha_operacion;porId('ganancia-concepto').value=m.concepto;porId('ganancia-monto').value=m.tipo==='ingreso'?m.ingreso_usd:m.gasto_usd;porId('ganancia-cancelar').hidden=false;porId('ganancia-guardar').textContent='Guardar corrección';porId('ganancia-concepto').focus();};const anular=elemento('button','Anular');anular.type='button';anular.onclick=async()=>{if(!confirm('¿Anular este movimiento? Quedará registrado en el historial de correcciones.'))return;anular.disabled=true;try{await api('/admin/ganancia/manual/'+m.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({version:m.version,anular:true})});await cargarGanancia();}catch(e){porId('ganancia-estado').textContent=e.message;anular.disabled=false;}};fila.append(editar,anular);}else{const completar=elemento('button','Completar o corregir');completar.type='button';completar.onclick=()=>{completando=m;const d=porId('ganancia-completar');d.hidden=false;d.open=true;porId('ganancia-completar-concepto').textContent=m.concepto;for(const campo of ['ingreso_usd','costo_usd','comision_usd','gasto_usd'])porId('ganancia-'+campo).value=m[campo]??'';porId('ganancia-evidencia').value=m.estado_evidencia==='confirmado'?'confirmado':'estimado';porId('ganancia-motivo').value='';d.scrollIntoView({block:'center'});};fila.append(completar);}porId('ganancia-listado').append(fila);}
 }catch(e){if(secuencia===consultando)porId('ganancia-estado').textContent=e.message;}}
 porId('ganancia-filtro').addEventListener('submit',e=>{e.preventDefault();cargarGanancia();});
 porId('ganancia-manual').addEventListener('submit',async e=>{e.preventDefault();const b=porId('ganancia-guardar');b.disabled=true;const datos={clave:claveManual,fecha:porId('ganancia-fecha').value,concepto:porId('ganancia-concepto').value,tipo:porId('ganancia-tipo').value,monto_usd:porId('ganancia-monto').value.replace(',','.')};const anterior=editando;if(anterior)datos.version=anterior.version;porId('ganancia-manual-estado').textContent='Guardando…';try{await api('/admin/ganancia/manual'+(anterior?'/'+anterior.id:''),{method:anterior?'PATCH':'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});resetManual();porId('ganancia-manual-estado').textContent='Movimiento guardado en USD.';await cargarGanancia();}catch(e){porId('ganancia-manual-estado').textContent=e.message;}finally{b.disabled=false;}});
 porId('ganancia-completar-form').addEventListener('submit',async e=>{e.preventDefault();if(!completando)return;const boton=e.submitter;boton.disabled=true;const m=completando;const datos={version:m.version,motivo:porId('ganancia-motivo').value,estado_evidencia:porId('ganancia-evidencia').value};for(const campo of ['ingreso_usd','costo_usd','comision_usd','gasto_usd'])datos[campo]=porId('ganancia-'+campo).value.replace(',','.');try{await api('/admin/ganancia/'+m.id+'/completar',{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify(datos)});porId('ganancia-completar').hidden=true;completando=null;await cargarGanancia();}catch(error){porId('ganancia-completar-estado').textContent=error.message;}finally{boton.disabled=false;}});
 abrirSeccionAdmin();
})();
</script>
