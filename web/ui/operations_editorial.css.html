<style>
  /* Lenguaje visual compartido por el panel de admin y el del cadete.
     Va después de cada CSS de panel: unifica tokens, tipografía, botones,
     superficies y estados con el modo Classic de la web. Solo estilo. */
  @font-face { font-family: 'Geist'; src: url('/fonts/geist-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Geist Mono'; src: url('/fonts/geist-mono-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('/fonts/instrument-serif-latin-400-normal.woff2') format('woff2'); font-weight: 400; font-display: swap; }
  @font-face { font-family: 'Instrument Serif'; src: url('/fonts/instrument-serif-latin-400-italic.woff2') format('woff2'); font-weight: 400; font-style: italic; font-display: swap; }

  :root {
    --op-bg: #141414;
    --op-surface: #1c1c1c;
    --op-surface-2: #252525;
    --op-surface-3: #303030;
    --op-border: #2c2c2c;
    --op-border-strong: #404040;
    --op-text: #f2f2f2;
    --op-text-dim: #ababab;
    --op-text-faint: #8a8a8a;
    --op-accent: #d7262f;
    --op-accent-hover: #ea3a40;
    --op-accent-press: #b51d25;
    --op-accent-bg: #2e1617;
    --op-accent-border: #6b2a2c;
    --op-danger-text: #ff8a85;
    --op-success: #4ade9b;
    --op-success-bg: #12261c;
    --op-success-border: #24563b;
    --op-warning: #f2c46d;
    --op-input-bg: #171717;
    --op-r-sm: 8px;
    --op-r-md: 10px;
    --op-r-lg: 14px;
    --op-fs-display: clamp(34px, 4.6vw, 56px);
    --op-fs-title: 19px;
    --op-fs-body: 14px;
    --op-fs-small: 13px;
    --op-fs-micro: 12px;
    --op-ease: cubic-bezier(.16, 1, .3, 1);
    --op-dur: 180ms;
    --op-font: 'Geist', Arial, Helvetica, sans-serif;
    --op-serif: 'Instrument Serif', Georgia, serif;
    --op-mono: 'Geist Mono', ui-monospace, monospace;
    --op-shadow: 0 1px 0 rgba(255,255,255,.03) inset, 0 12px 32px -18px rgba(0,0,0,.7);
    --op-focus: #ff7a6e;
  }
  html[data-classic-theme="light"] {
    --op-bg: #f4f4f2;
    --op-surface: #ffffff;
    --op-surface-2: #f0efec;
    --op-surface-3: #e5e4e0;
    --op-border: #e2e1dd;
    --op-border-strong: #c9c8c3;
    --op-text: #1b1b1b;
    --op-text-dim: #5c5c5c;
    --op-text-faint: #6e6e6e;
    --op-accent-bg: #fbe7e5;
    --op-accent-border: #e3a7a3;
    --op-danger-text: #b1231f;
    --op-success: #17704a;
    --op-success-bg: #e3f3ea;
    --op-success-border: #93c9ab;
    --op-warning: #8a5a12;
    --op-input-bg: #ffffff;
    --op-shadow: 0 1px 2px rgba(20,20,20,.05), 0 12px 32px -20px rgba(20,20,20,.25);
    --op-focus: #c3241d;
    color-scheme: light;
  }
  html { color-scheme: dark; -webkit-text-size-adjust: 100%; scrollbar-width: thin; scrollbar-color: var(--op-border-strong) var(--op-bg); }
  ::selection { background: var(--op-accent); color: #fff; }
  ::-webkit-scrollbar { width: 10px; height: 10px; }
  ::-webkit-scrollbar-track { background: var(--op-bg); }
  ::-webkit-scrollbar-thumb { background: var(--op-border-strong); border: 2px solid var(--op-bg); border-radius: 10px; }

  /* --- Base --- */
  html body {
    display: block; min-height: 100vh; margin: 0; padding: 0;
    background: var(--op-bg); color: var(--op-text);
    font-family: var(--op-font); font-size: var(--op-fs-body); line-height: 1.5;
    -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility;
    font-feature-settings: "ss01", "cv11";
  }
  /* Barra de marca: el logo apilado de la web, compacto y fijo arriba. */
  html body::before {
    content: "THE\A TECH\A ROOM\A ARG."; display: block; white-space: pre;
    position: sticky; top: 0; z-index: 15;
    padding: 14px clamp(20px, 4vw, 56px);
    border-bottom: 1px solid var(--op-border);
    background: color-mix(in srgb, var(--op-bg) 86%, transparent);
    -webkit-backdrop-filter: saturate(140%) blur(12px); backdrop-filter: saturate(140%) blur(12px);
    color: var(--op-text);
    font: 800 13px/.86 Arial, Helvetica, sans-serif; letter-spacing: -.04em;
  }
  html body :is(input, select, textarea, button) { font-family: inherit; }
  :is(button, a, input, select, textarea, summary, [tabindex]):focus-visible { outline: 2px solid var(--op-focus) !important; outline-offset: 2px; }

  /* --- Contenedor y encabezado de página --- */
  body .panel { width: 100%; max-width: 1240px; margin: 0 auto; padding: clamp(28px, 4vw, 56px) clamp(20px, 4vw, 56px) 96px; border: 0; border-radius: 0; background: transparent; box-shadow: none; }
  body.op-cadete .panel { max-width: 560px; }
  body .panel-header { display: flex; align-items: flex-end; justify-content: space-between; gap: 20px; margin: 0 0 28px; padding: 0 0 24px; border-bottom: 1px solid var(--op-border); }
  body .panel-header h1 { margin: 0; font-family: var(--op-serif); font-size: var(--op-fs-display); font-weight: 400; line-height: .95; letter-spacing: -.02em; color: var(--op-text); text-wrap: balance; }
  body .panel-header-acciones { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: 8px; }
  body .panel h2 { font-size: var(--op-fs-title); font-weight: 600; letter-spacing: -.015em; line-height: 1.25; color: var(--op-text); }
  body .panel h3 { letter-spacing: -.01em; }

  /* --- Login --- */
  body .tarjeta { width: calc(100% - 40px); max-width: 380px; margin: clamp(56px, 12vh, 120px) auto; padding: 32px 28px 28px; border: 1px solid var(--op-border); border-radius: var(--op-r-lg); background: var(--op-surface); box-shadow: var(--op-shadow); }
  body .tarjeta h1 { margin: 0 0 22px; font-family: var(--op-serif); font-size: 38px; font-weight: 400; line-height: 1; letter-spacing: -.02em; }
  body .tarjeta :is(input, button) { width: 100%; min-height: 48px; margin: 0 0 10px; border-radius: var(--op-r-sm); font-size: 16px; }
  body .tarjeta .error { color: var(--op-danger-text); font-size: var(--op-fs-small); }

  /* --- Campos --- */
  body :is(input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea) {
    border: 1px solid var(--op-border-strong); border-radius: var(--op-r-sm);
    background-color: var(--op-input-bg); color: var(--op-text);
    transition: border-color var(--op-dur) var(--op-ease), box-shadow var(--op-dur) var(--op-ease);
  }
  body :is(input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea):hover { border-color: var(--op-text-faint); }
  body :is(input:not([type=checkbox]):not([type=radio]):not([type=file]), select, textarea):focus { border-color: var(--op-text-dim); box-shadow: 0 0 0 3px color-mix(in srgb, var(--op-accent) 22%, transparent); outline: 0; }
  body :is(input, textarea)::placeholder { color: var(--op-text-faint); opacity: 1; }
  body input[type=checkbox], body input[type=radio] { accent-color: var(--op-accent); }
  body input[type=date] { color-scheme: inherit; font-variant-numeric: tabular-nums; }
  html[data-classic-theme="light"] body input[type=date] { color-scheme: light; }
  body label { color: var(--op-text-dim); }

  /* --- Botones: una sola familia ---
     Neutro (superficie) por defecto; primario rojo para la acción principal;
     peligro con texto rojo; éxito en verde. */
  body .panel :is(button, a[class*="btn"], .admin-secciones a):not(.ordenar-columna):not(.tarea-cerrar):not(.serie-foto button) {
    border-radius: var(--op-r-sm); font-weight: 600; letter-spacing: -.005em;
    transition: background-color var(--op-dur) var(--op-ease), border-color var(--op-dur) var(--op-ease), color var(--op-dur) var(--op-ease), transform var(--op-dur) var(--op-ease), box-shadow var(--op-dur) var(--op-ease);
  }
  body :is(.tarjeta button, .tarea-toggle, .tarea-campos button, .nota-campos button, .btn-enviar-recibo, .btn-completar-tarea, #series-enviar, #direccion-guardar, #fecha-entrega-guardar, #mail-enviar, .acciones-mailing button, #btn-nuevo-cliente, .admin-vista button[type=submit]) {
    background: var(--op-accent); border: 1px solid var(--op-accent); color: #fff;
    box-shadow: 0 1px 0 rgba(255,255,255,.14) inset, 0 6px 16px -10px rgba(215,38,47,.9);
  }
  body :is(.tarjeta button, .tarea-toggle, .tarea-campos button, .nota-campos button, .btn-enviar-recibo, .btn-completar-tarea, #series-enviar, #direccion-guardar, #fecha-entrega-guardar, #mail-enviar, .acciones-mailing button, #btn-nuevo-cliente, .admin-vista button[type=submit]):hover:not(:disabled) {
    background: var(--op-accent-hover); border-color: var(--op-accent-hover); transform: translateY(-1px);
    box-shadow: 0 1px 0 rgba(255,255,255,.16) inset, 0 10px 20px -10px rgba(215,38,47,.95);
  }
  body :is(button, a[class*="btn"]):active:not(:disabled) { transform: translateY(0) scale(.98); }
  body :is(button, a[class*="btn"]):disabled { opacity: .45; cursor: not-allowed; transform: none; box-shadow: none; }
  body :is(.btn-eliminar, .btn-eliminar-entrega, .btn-eliminar-tarea, #btn-eliminar-masivo, .btn-mayorista-activo) { background: transparent; border-color: var(--op-accent-border); color: var(--op-danger-text); }
  body :is(.btn-eliminar, .btn-eliminar-entrega, .btn-eliminar-tarea, #btn-eliminar-masivo):hover:not(:disabled) { background: var(--op-accent-bg); }
  body :is(.btn-whatsapp-cliente, .btn-quitar-derivacion) { background: var(--op-success-bg); border: 1px solid var(--op-success-border); color: var(--op-success); }
  body :is(.btn-whatsapp-cliente, .btn-quitar-derivacion):hover { background: color-mix(in srgb, var(--op-success-bg) 70%, var(--op-success) 18%); }
  body .tarea-cerrar { border-radius: var(--op-r-sm); color: var(--op-text-dim); }
  body .tarea-cerrar:hover { background: var(--op-surface-2); color: var(--op-text); }

  /* --- Navegación de secciones: control segmentado --- */
  body .admin-secciones { display: inline-flex; flex-wrap: wrap; gap: 2px; margin: 0 0 32px; padding: 4px; border: 1px solid var(--op-border); border-radius: calc(var(--op-r-sm) + 4px); background: var(--op-surface); }
  body.admin-entregas .admin-secciones a, body .admin-secciones a { min-height: 38px; padding: 8px 16px; border: 0; border-radius: var(--op-r-sm); background: transparent; color: var(--op-text-dim); font-weight: 500; }
  body.admin-entregas .admin-secciones a:hover, body .admin-secciones a:hover { background: var(--op-surface-2); color: var(--op-text); }
  body.admin-entregas .admin-secciones a[aria-current=page], body .admin-secciones a[aria-current=page] { background: var(--op-text); color: var(--op-bg); border: 0; box-shadow: 0 1px 2px rgba(0,0,0,.25); }
  body.admin-entregas .admin-secciones a[aria-current=page]:hover { background: var(--op-text); }

  /* --- Superficies: bloques de trabajo --- */
  body :is(.pedidos-hoy, .historial-pedidos, .admin-vista, .subseccion, .modal-series-contenido, .modal-direccion-contenido, .modal-fecha-contenido, .modal-mail-contenido) {
    border: 1px solid var(--op-border); border-radius: var(--op-r-lg); background: var(--op-surface); box-shadow: var(--op-shadow);
  }
  body :is(.pedidos-hoy, .historial-pedidos, .admin-vista) { padding: clamp(18px, 2.4vw, 28px); margin: 0 0 24px; }
  body :is(.pedidos-hoy, .historial-pedidos) h2 { margin: 0 0 16px; }
  body .subseccion { padding: clamp(18px, 2.4vw, 24px); }
  body .grupo-responsable { margin: 24px 0 10px; color: var(--op-text-dim); font-size: var(--op-fs-micro); font-weight: 600; letter-spacing: .08em; }
  body .papelera-item { border-radius: var(--op-r-md); border-color: var(--op-border); }

  /* Cada entrega/tarea es una parada: tarjeta propia, sin anidar sombras. */
  body :is(.pedido-hoy, .pedido-historico) {
    margin: 0 0 12px; padding: 20px; border: 1px solid var(--op-border); border-radius: var(--op-r-md);
    background: var(--op-surface-2); box-shadow: none; color: var(--op-text-dim);
    transition: border-color var(--op-dur) var(--op-ease), background-color var(--op-dur) var(--op-ease);
  }
  body .pedido-hoy:hover { border-color: var(--op-border-strong); }
  body .pedido-hoy-detalle > strong { color: var(--op-text); font-size: 17px; font-weight: 600; letter-spacing: -.015em; line-height: 1.35; }
  body .pedido-hoy.arrastrando { opacity: .5; border-style: dashed; }
  body .arrastrar-entrega { border-color: var(--op-border); border-radius: var(--op-r-sm); background: var(--op-surface); color: var(--op-text-faint); }
  body .arrastrar-entrega:hover { color: var(--op-text); border-color: var(--op-border-strong); }
  body .direccion-entrega { color: var(--op-text); font-weight: 500; }
  body .observacion-cadete { color: var(--op-warning); }
  body .total-cadete { color: var(--op-text); font-family: var(--op-mono); font-variant-numeric: tabular-nums; letter-spacing: -.02em; }
  body .estado-recibo { color: var(--op-text-faint); }

  /* Números: precios, celulares, fechas y saldos en mono tabular. */
  body :is(td, .pedido-hoy-detalle, .pedido-historico, .ganancia-resumen, .ganancia-desglose, #cotizacion-actual) { font-variant-numeric: tabular-nums; }
  body :is(#cotizacion-actual, .ganancia-resumen strong) { font-family: var(--op-mono); letter-spacing: -.03em; }

  /* --- Tablas --- */
  body table { border-collapse: separate; border-spacing: 0; color: var(--op-text-dim); font-size: var(--op-fs-body); }
  body :is(th, td) { padding: 14px 12px; border-bottom: 1px solid var(--op-border); vertical-align: middle; }
  body th, body th .ordenar-columna { color: var(--op-text-faint); font-size: 11px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }
  body th .ordenar-columna:hover { color: var(--op-text); text-decoration: none; }
  body td:first-of-type + td { color: var(--op-text); font-weight: 500; }
  body tbody tr { transition: background-color var(--op-dur) var(--op-ease); }
  body tbody tr:hover td { background: var(--op-surface); }
  body .tipo-cliente { padding: 3px 9px; border: 1px solid var(--op-border); font-size: 11px; font-weight: 600; letter-spacing: .02em; }
  body .tipo-cliente-mayorista { border-color: var(--op-success-border); }
  body .btn-historial { padding: 6px; border-radius: var(--op-r-sm); }
  body .btn-historial:hover { background: var(--op-surface-2); }
  body .cuenta-cliente-acciones { gap: 6px; }

  /* --- Modales --- */
  body :is(.modal-series, .modal-direccion, .modal-fecha-entrega, .modal-mail) {
    background: color-mix(in srgb, #000 62%, transparent);
    -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px);
  }
  body :is(.modal-series-contenido, .modal-direccion-contenido, .modal-fecha-contenido, .modal-mail-contenido) {
    padding: 24px; max-height: calc(100dvh - 32px); overflow-y: auto; overscroll-behavior: contain;
    box-shadow: 0 24px 64px -24px rgba(0,0,0,.8);
    animation: op-entrar 320ms var(--op-ease) both;
  }
  body :is(.modal-series, .modal-direccion, .modal-fecha-entrega, .modal-mail) h2 { margin: 0 0 12px; font-size: 20px; font-weight: 600; letter-spacing: -.02em; }
  @keyframes op-entrar { from { opacity: 0; transform: translateY(10px) scale(.985); } to { opacity: 1; transform: none; } }

  /* --- Vacíos y avisos --- */
  body .vacio { padding: 40px 16px; border: 1px dashed var(--op-border); border-radius: var(--op-r-md); color: var(--op-text-faint); }
  body .tarea-direccion-sugerencias { border-radius: var(--op-r-sm); overflow: hidden; box-shadow: 0 16px 32px -16px rgba(0,0,0,.7); }

  /* --- Cadete: pensado para el pulgar --- */
  body.op-cadete .pedido-hoy { padding: 18px; background: var(--op-surface); }
  body.op-cadete .pedido-acciones > * { min-height: 48px; }
  body.op-cadete .proximos-dia h3 { color: var(--op-text-faint); font-size: var(--op-fs-micro); font-weight: 600; letter-spacing: .08em; text-transform: uppercase; }

  @media (max-width: 700px) {
    html body::before { padding: 12px 20px; font-size: 12px; }
    body .panel { padding: 24px 16px 72px; }
    body .panel-header { align-items: flex-start; flex-direction: column; }
    body .panel-header-acciones { justify-content: flex-start; }
    body .admin-secciones { display: flex; width: 100%; }
    body .admin-secciones a { flex: 1 1 auto; }
    body :is(.pedido-hoy, .pedido-historico) { padding: 16px; }
    body #tabla-clientes tr { border-radius: var(--op-r-md); background: var(--op-surface); }
    body #tabla-clientes tbody tr:hover td { background: transparent; }
  }
  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after { animation-duration: .01ms !important; transition-duration: .01ms !important; scroll-behavior: auto !important; }
  }
</style>
<script>try { if (localStorage.getItem('ttra_classic_theme') === 'light') document.documentElement.setAttribute('data-classic-theme', 'light'); } catch {}</script>
