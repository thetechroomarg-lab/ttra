    <a class="ttra-page-brand" href="/" aria-label="The Tech Room Arg, volver al inicio">THE<br>TECH<br>ROOM<br>ARG<span>.</span></a>
    <div class="ttra-page-actions"><a class="ttra-page-link" href="/">Volver al inicio</a></div>

  <main class="lw-main">
    <h1 class="lw-titulo">Listado WhatsApp<span>.</span></h1>
    <p class="lw-intro">Mi listado completo, listo para pegar en tu WhatsApp. Elegí la columna que te sirve, poné el nombre de tu emprendimiento y copialo.</p>

    <section class="lw-config" aria-label="Datos de tu listado">
      <div class="lw-campo">
        <label for="lw-nombre">Nombre de tu emprendimiento</label>
        <input id="lw-nombre" type="text" maxlength="60" autocomplete="organization" placeholder="Ej. Tecno Sur">
        <p class="lw-ayuda">Aparece arriba de cada listado.</p>
      </div>
      <div class="lw-campo">
        <label for="lw-dolar">Tu dólar (opcional)</label>
        <input id="lw-dolar" type="text" inputmode="decimal" autocomplete="off" placeholder="Dólar de la página" aria-describedby="lw-dolar-ayuda">
        <p class="lw-ayuda" id="lw-dolar-ayuda"></p>
      </div>
    </section>

    <div class="lw-estado" id="lw-estado" role="status">
      <p>Armando tu listado…</p>
    </div>
    <p class="lw-anuncio" id="lw-anuncio" role="status" aria-live="polite"></p>
