  <script>
    // Antes esta página nunca seteaba data-modo — caía en la paleta base de
    // theme.css (look Fallout), un modo que ya no es accesible al usuario.
    // Classic es el único modo del sitio ahora.
    document.documentElement.setAttribute("data-modo", "classic");
    try {
      if (localStorage.getItem("ttra_classic_theme") === "light") {
        document.documentElement.setAttribute("data-classic-theme", "light");
      }
    } catch {
      // Sin storage, el catálogo conserva el Classic oscuro por defecto.
    }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE TECH ROOM ARG — Catálogo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="catalogo.css">
  <link rel="stylesheet" href="classic-editorial.css">
  <link rel="stylesheet" href="site-pages.css">
  <link rel="stylesheet" href="/site-header.css">
  <link rel="stylesheet" href="/disclosure.css">
  <link rel="stylesheet" href="/carrito.css">
  <script src="/site-header.js" defer></script>
  <link rel="stylesheet" href="/comparar-productos.css">

<body class="catalog-page ttra-page">
  <div id="rc-boot"></div>
  <div class="rc-crt"></div>
  <header class="catalog-header ttra-page-header">
    <a class="catalog-brand ttra-page-brand" href="/" aria-label="The Tech Room Arg, volver al inicio">THE<br>TECH<br>ROOM<br>ARG<span>.</span></a>
    <div class="catalog-header-actions ttra-page-actions">
      <a class="catalog-back" href="/">← Volver al inicio</a>
      <a class="catalog-login" id="catalog-login" href="/login.html">Ingresar</a>
      <button id="btn-logout" type="button" hidden>Cerrar sesión</button>
    </div>
  </header>

  <section class="catalog-intro" aria-labelledby="catalog-title">
    <h1 id="catalog-title">Todo el catálogo<span>.</span></h1>
    <p>Explorá todos los productos.</p>
  </section>

  <div class="carrousel-wrap">
    <div class="carrousel" id="carrousel"></div>
  </div>

  <div class="catalog-filter-header"><span id="contador-productos" aria-live="polite">Cargando productos…</span></div>
  <div class="catalog-search-wrap" hidden><label for="catalog-search">Buscar productos</label><input id="catalog-search" type="search" placeholder="Buscá por producto o marca" autocomplete="off"></div>
  <div class="catalog-brand-filter" id="catalog-filters">
    <div class="catalog-filter-field"><label for="marca-filter">Filtrar por marca</label><select id="marca-filter"><option value="">Todas las marcas</option></select></div>
    <div class="catalog-filter-field" id="condition-filter-field" hidden><label for="condition-filter">Estado</label><select id="condition-filter"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="usado">Usado</option><option value="cpo">CPO</option></select></div>
  </div>
  <main id="secciones"></main>

  <footer class="ttra-page-footer"><div class="ttra-page-footer-brand">THE<br>TECH<br>ROOM<br>ARG<span>.</span></div><p>© The Tech Room Arg · Córdoba</p></footer>

  <script src="boot.js"></script>
  <script src="precios.js"></script>
  <script src="carrito.js"></script>
  <script src="/comparar-productos.js"></script>
  <script src="catalogo.js"></script>
  <script src="/scroll-lock.js"></script>
</body>
