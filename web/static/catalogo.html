  <script>
    try {
      if (localStorage.getItem("ttra_classic_theme") === "light") {
        document.documentElement.setAttribute("data-classic-theme", "light");
      }
    } catch {
      // Sin storage, el catálogo conserva el Classic oscuro por defecto.
    }
  </script>
  <meta charset="utf-8">

  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="catalogo.css">
</head>
