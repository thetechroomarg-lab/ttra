<!doctype html>
<html lang="es">
<head>
  <!-- Google tag (gtag.js) -->

  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZPQR91G145');

  <script>
    // Antes esta página nunca seteaba data-modo — caía en la paleta base de
    // theme.css (look Fallout), un modo que ya no es accesible al usuario.
    // Classic es el único modo del sitio ahora.
    document.documentElement.setAttribute("data-modo", "classic");
    try {
      if (localStorage.getItem("ttra_classic_theme") === "light") {
        document.documentElement.setAttribute("data-classic-theme", "light");
      }
    } catch {
      // Sin storage, el catálogo conserva el Classic oscuro por defecto.
    }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE TECH ROOM ARG — Catálogo</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="catalogo.css">
  <link rel="stylesheet" href="classic-editorial.css">
  <link rel="stylesheet" href="site-pages.css">
  <link rel="stylesheet" href="/site-header.css">
  <link rel="stylesheet" href="/disclosure.css">
  <link rel="stylesheet" href="/carrito.css">
  <script src="/site-header.js" defer></script>
  <link rel="stylesheet" href="/comparar-productos.css">
  <link rel="stylesheet" href="/catalog-images.css?v=1">
</head>
<body class="catalog-page ttra-page">
  <div id="rc-boot"></div>
  <div class="rc-crt"></div>
  <header class="catalog-header ttra-page-header">
    <a class="catalog-brand ttra-page-brand" href="/" aria-label="The Tech Room Arg, volver al inicio">THE<br>TECH<br>ROOM<br>ARG<span>.</span></a>
    <div class="catalog-header-actions ttra-page-actions">
      <a class="ttra-back" href="/">Volver al inicio</a>
      <a class="catalog-login" id="catalog-login" href="/login.html">Ingresar</a>
      <button id="btn-logout" type="button" hidden>Cerrar sesión</button>
    </div>
  </header>

  <section class="catalog-intro" aria-labelledby="catalog-title">
    <h1 id="catalog-title">Todo el catálogo<span>.</span></h1>
    <p>Explorá todos los productos.</p>
  </section>

  <div class="carrousel-wrap">
    <div class="carrousel" id="carrousel"></div>
  </div>

  <div class="catalog-filter-header"><span id="contador-productos" aria-live="polite">Cargando productos…</span></div>
  <div class="catalog-search-wrap" hidden><label for="catalog-search">Buscar productos</label><input id="catalog-search" type="search" placeholder="Buscá por producto o marca" autocomplete="off"></div>
  <div class="catalog-brand-filter" id="catalog-filters">
    <div class="catalog-filter-field" id="tipo-filter-field" hidden><label for="tipo-filter">Tipo</label><select id="tipo-filter"><option value="">Todos</option><option value="Notebook">Notebooks</option><option value="Mac">Macbooks</option></select></div>
    <div class="catalog-filter-field" id="marca-filter-field"><label for="marca-filter">Filtrar por marca</label><select id="marca-filter"><option value="">Todas las marcas</option></select></div>
    <div class="catalog-filter-field" id="condition-filter-field" hidden><label for="condition-filter">Estado</label><select id="condition-filter"><option value="">Todos</option><option value="nuevo">Nuevo</option><option value="usado">Usado</option><option value="cpo">CPO</option></select></div>
    <fieldset class="catalog-sort" id="catalog-sort">
      <legend>Ordenar</legend>
      <div class="catalog-sort-options">
        <label><input type="radio" name="orden" value="destacados" checked><span>Destacados</span></label>
        <label><input type="radio" name="orden" value="precio-asc"><span>Menor precio</span></label>
        <label><input type="radio" name="orden" value="precio-desc"><span>Mayor precio</span></label>
      </div>
    </fieldset>
    <label class="catalog-cuotas" for="cuotas-filter">
      <input type="checkbox" id="cuotas-filter" role="switch">
      <span class="catalog-cuotas-track" aria-hidden="true"><span class="catalog-cuotas-thumb"></span></span>
      <span class="catalog-cuotas-text"><strong>En cuotas</strong><span id="cuotas-count"></span></span>
    </label>
    <section class="catalog-price" id="catalog-price" aria-labelledby="catalog-price-title">
      <div class="catalog-price-head">
        <h2 id="catalog-price-title">Precio</h2>
        <button type="button" id="price-reset" class="catalog-price-reset" hidden>Restablecer</button>
        <div class="catalog-price-values" aria-live="polite">
          <output id="price-readout" for="price-min-range price-max-range"></output>
          <p id="price-readout-pesos"></p>
        </div>
      </div>
      <div class="catalog-price-hist" id="price-hist" aria-hidden="true"></div>
      <div class="catalog-price-slider">
        <div class="catalog-price-track"><div class="catalog-price-fill" id="price-fill"></div></div>
        <input type="range" id="price-min-range" min="0" max="1000" step="1" value="0" aria-label="Precio mínimo">
        <input type="range" id="price-max-range" min="0" max="1000" step="1" value="1000" aria-label="Precio máximo">
      </div>
    </section>
  </div>
  <main id="secciones"></main>

  <footer class="ttra-page-footer"><div class="ttra-page-footer-brand">THE<br>TECH<br>ROOM<br>ARG<span>.</span></div><p>© The Tech Room Arg · Córdoba</p></footer>

  <script src="boot.js"></script>
  <script src="precios.js"></script>
  <script src="carrito.js"></script>
  <script src="/comparar-productos.js"></script>
  <script src="/catalog-images.js?v=1"></script>
  <script src="catalogo.js"></script>
  <script src="/scroll-lock.js"></script>
</body>
</html>
