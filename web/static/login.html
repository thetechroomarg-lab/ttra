<!doctype html>
<html lang="es" data-modo="classic">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE TECH ROOM ARG — Ingresar</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="login.css">
</head>
<body>
  <div id="rc-boot"></div>
  <div class="rc-crt"></div>
  <main class="tarjeta">
    <h1 id="titulo-login">Bienvenid@ a The Tech Room Arg</h1>

    <form id="form-login" class="form">
      <input type="email" id="login-email" placeholder="Email" autocomplete="email" required>
      <div class="rc-password-wrap">
        <input type="password" id="login-password" placeholder="Contraseña" autocomplete="current-password" required>
        <button type="button" id="btn-ver-login-password" class="rc-password-toggle" aria-label="Mostrar contraseña" tabindex="-1">
          <svg class="rc-password-icono rc-password-icono-mostrar" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
          </svg>
          <svg class="rc-password-icono rc-password-icono-ocultar" viewBox="0 0 24 24" aria-hidden="true">
            <path d="M1.5 12S5 5 12 5s10.5 7 10.5 7-3.5 7-10.5 7S1.5 12 1.5 12Z" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round"/>
            <circle cx="12" cy="12" r="3" fill="none" stroke="currentColor" stroke-width="1.6"/>
            <line x1="3" y1="21" x2="21" y2="3" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/>
          </svg>
        </button>
      </div>
      <button type="submit">Ingresar</button>
      <p class="error" id="login-error"></p>
      <p class="ok" id="login-ok"></p>
      <p class="rc-switch-form">¿No tenés cuenta? <a href="#" id="link-ir-a-registro">Creá una acá</a></p>
    </form>

    <form id="form-registro" class="form oculto">
      <input type="text" id="registro-nombre" placeholder="Nombre" autocomplete="given-name" required>
      <input type="text" id="registro-apellido" placeholder="Apellido" autocomplete="family-name" required>
      <input type="password" id="registro-password" placeholder="Contraseña (mínimo 8 caracteres)" autocomplete="new-password" minlength="8" required>
      <input type="password" id="registro-password-repetir" placeholder="Repetir contraseña" autocomplete="new-password" minlength="8" required>
      <input type="tel" id="registro-celular" placeholder="Celular" autocomplete="tel" required>
      <input type="email" id="registro-email" placeholder="Email" autocomplete="email" required>
      <button type="submit">Crear cuenta</button>
      <p class="error" id="registro-error"></p>
      <p class="ok" id="registro-ok"></p>
      <p class="rc-switch-form">¿Ya tenés cuenta? <a href="#" id="link-ir-a-login">Iniciá sesión acá</a></p>
    </form>

    <form id="form-cambiar-obligatorio" class="form oculto">
      <p class="rc-switch-form">Te reseteamos la contraseña — elegí una nueva para poder seguir.</p>
      <input type="password" id="cambiar-password" placeholder="Contraseña nueva" autocomplete="new-password" required>
      <input type="password" id="cambiar-password-repetir" placeholder="Repetir contraseña nueva" autocomplete="new-password" required>
      <button type="submit">Confirmar</button>
      <p class="error" id="cambiar-error"></p>
    </form>
  </main>
  <script src="boot.js"></script>
  <script src="login.js"></script>
</body>
</html>
