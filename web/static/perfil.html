<!doctype html>
<html lang="es">
<head>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-ZPQR91G145"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-ZPQR91G145');
  </script>
  <script>
    // Modo Fallout deshabilitado (a pedido: sin acceso de usuario por
    // ahora) — se comenta el atajo ?modo=fallout en vez de borrarlo.
    // document.documentElement.setAttribute(
    //   "data-modo",
    //   new URLSearchParams(location.search).get("modo") === "fallout" ? "fallout" : "classic"
    // );
    document.documentElement.setAttribute("data-modo", "classic");
    try {
      if (localStorage.getItem("ttra_classic_theme") === "light") {
        document.documentElement.setAttribute("data-classic-theme", "light");
      }
    } catch {
      // Sin storage, el perfil conserva el Classic oscuro por defecto.
    }
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>THE TECH ROOM ARG — Mi perfil</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="manifest" href="/manifest.json">
  <link rel="apple-touch-icon" href="/apple-touch-icon.png">
  <meta name="theme-color" content="#000000">
  <link rel="stylesheet" href="theme.css">
  <link rel="stylesheet" href="classic.css">
  <link rel="stylesheet" href="login.css">
  <link rel="stylesheet" href="perfil.css">
</head>
<body>
  <div class="rc-crt"></div>
  <main class="tarjeta">
    <a id="link-volver" class="rc-perfil-volver" href="/">← Volver</a>
    <h1>Mi perfil</h1>
    <form id="form-perfil" class="form">
      <input id="perfil-nombre" type="text" placeholder="Nombre" autocomplete="given-name" required>
      <input id="perfil-apellido" type="text" placeholder="Apellido" autocomplete="family-name" required>
      <input id="perfil-email" type="email" placeholder="Email" disabled>
      <input id="perfil-celular" type="tel" placeholder="Celular" autocomplete="tel" required>
      <button type="submit">Guardar cambios</button>
      <p class="error" id="perfil-error"></p>
      <p class="ok" id="perfil-ok"></p>
    </form>

    <section id="seccion-condiciones-mayorista" class="oculto">
      <h2>Condiciones mayoristas</h2>
      <p id="condiciones-mayorista-fecha" class="ok"></p>
      <button type="button" id="btn-ver-condiciones-mayorista">Ver condiciones mayoristas</button>
    </section>

    <h2>Mis domicilios</h2>
    <div id="lista-domicilios" class="lista-domicilios"></div>
    <form id="form-domicilio" class="form">
      <input id="domicilio-alias" type="text" placeholder="Nombre (ej. Casa, Oficina)" maxlength="80" required>
      <div class="perfil-direccion-wrap">
        <input id="domicilio-direccion" type="text" placeholder="Dirección" autocomplete="street-address" maxlength="500" required>
        <ul id="perfil-sugerencias-direccion" class="perfil-sugerencias-direccion" role="listbox" aria-label="Sugerencias de dirección" hidden></ul>
      </div>
      <button type="submit" id="btn-guardar-domicilio">Agregar domicilio</button>
      <button type="button" id="btn-cancelar-edicion-domicilio" class="oculto">Cancelar</button>
      <p class="error" id="domicilio-error"></p>
      <p class="ok" id="domicilio-ok"></p>
    </form>

    <h2>Cambiar contraseña</h2>
    <form id="form-password" class="form">
      <input id="password-actual" type="password" placeholder="Contraseña actual" autocomplete="current-password" required>
      <input id="password-nueva" type="password" placeholder="Contraseña nueva" autocomplete="new-password" required minlength="8">
      <input id="password-nueva-repetir" type="password" placeholder="Repetir contraseña nueva" autocomplete="new-password" required minlength="8">
      <button type="submit">Cambiar contraseña</button>
      <p class="error" id="password-error"></p>
      <p class="ok" id="password-ok"></p>
    </form>
  </main>

  <div id="rc-terminos-mayorista" class="rc-terminos-overlay">
    <div class="rc-terminos-tarjeta">
      <div id="rc-terminos-contenido" class="rc-terminos-contenido"></div>
      <div class="rc-terminos-acciones">
        <button id="btn-terminos-cerrar" type="button">Cerrar</button>
      </div>
    </div>
  </div>

  <script src="boot.js"></script>
  <script src="perfil.js"></script>
</body>
</html>
